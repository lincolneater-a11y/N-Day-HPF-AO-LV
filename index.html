<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nutritionDay 2026 · HPF</title>
<meta name="description" content="Registro digital del nutritionDay 2026 · Hospital Papa Francisco">

<style>
:root{
  --navy:#1F2A44; --teal:#0F7C7C; --teal-l:#E3F2F1; --bord:#7A1F3D; --bord-l:#F6E7EC;
  --gold:#C9A227; --gold-l:#FBF4DF; --ink:#1d2433; --mut:#5d6677; --line:#dfe3ea; --bg:#f4f6f9; --ok:#1d7a46;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{padding-top:max(10px, env(safe-area-inset-top))!important;position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .brand{font-weight:700;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;gap:8px}
header.top .brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px}
header.top .sp{flex:1}
.hlogo{height:36px;width:36px;border-radius:50%;background:#fff;display:none;object-fit:contain}
.logos{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.logos img{height:96px;width:96px;max-width:44%;object-fit:contain;display:none}
.install{border:1.5px solid var(--gold);background:var(--gold-l)}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.chip.warn{background:var(--gold);color:var(--navy);font-weight:700;cursor:pointer}
.chip.demo{background:var(--bord);}
main{max-width:860px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:22px;margin:6px 0 4px;color:var(--navy)}
h2{font-size:18px;margin:18px 0 8px;color:var(--navy)}
.lead{color:var(--mut);margin:0 0 14px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
a.card,button.card{display:block;text-align:left;text-decoration:none;color:inherit;cursor:pointer;transition:transform .08s,box-shadow .12s;width:100%}
a.card:hover,button.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,42,68,.10)}
.card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;margin-bottom:8px}
.card h3{margin:0 0 3px;font-size:16px;color:var(--navy)}
.card p{margin:0;color:var(--mut);font-size:14px}
.card .who{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--teal-l);color:var(--teal)}
.t-teal{background:var(--teal-l);color:var(--teal)} .t-bord{background:var(--bord-l);color:var(--bord)} .t-gold{background:var(--gold-l);color:#8a6d0f} .t-navy{background:#e6e9f1;color:var(--navy)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
/* form */
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.prog{height:6px;background:#e3e7ee;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.pnav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
.pnav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--mut)}
.pnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pnav button.done{border-color:var(--teal);color:var(--teal)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin:10px 0}
.q .ql{font-weight:650;margin-bottom:8px;color:var(--navy)}
.q .ql .code{display:inline-block;min-width:34px;font-size:12px;font-weight:700;color:var(--teal);margin-right:4px}
.q .qh{font-size:13px;color:var(--mut);margin:-4px 0 8px}
.q.answered{border-left:4px solid var(--teal)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none;min-height:42px;display:flex;align-items:center;gap:6px;line-height:1.2;text-align:left}
.opt:hover{border-color:#b9c1cf}
.opt.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.chk.sel{background:var(--navy);border-color:var(--navy)}
.opt.chk::before{content:"";width:14px;height:14px;border:2px solid currentColor;border-radius:3px;opacity:.6;flex:0 0 auto}
.opt.chk.sel::before{content:"✓";border:0;opacity:1;font-size:14px;line-height:14px;width:14px}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--bord);margin:10px 0 6px;width:100%}
.row{padding:8px 0;border-top:1px dashed var(--line)}
.row:first-child{border-top:0}
.row .rl{font-size:14.5px;margin-bottom:6px}
.row .opts .opt{min-height:36px;padding:6px 11px;font-size:14px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.inl{display:flex;gap:8px;align-items:center}
.inl input{max-width:180px}
.unit{color:var(--mut);font-size:14px}
.ng{width:100%;border-collapse:collapse;font-size:14px}
.ng th{font-weight:600;color:var(--mut);font-size:12.5px;text-align:center;padding:4px}
.ng td{padding:4px;border-top:1px dashed var(--line)}
.ng td:first-child{padding-right:8px}
.ng input{min-height:38px;padding:6px 8px;text-align:center}
.ng input:disabled{background:#e9ecf1}
.hint{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--gold-l);color:#6b560e;margin:8px 0}
.hint.bord{background:var(--bord-l);color:var(--bord)}
.hint.teal{background:var(--teal-l);color:#0b5c5c}
.idbox{border:2px dashed var(--bord);background:#fffafb}
.idbox .ql{color:var(--bord)}
.bar{padding-bottom:max(10px, env(safe-area-inset-bottom))!important;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:15;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.bar .in{max-width:860px;width:100%;display:flex;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:650;cursor:pointer;min-height:46px;background:#e8ebf1;color:var(--navy)}
.btn.pri{background:var(--teal);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.bord{background:var(--bord);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.grow{flex:1}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.toast.err{background:var(--bord)}
.review .rv{display:grid;grid-template-columns:1fr 1.1fr;gap:4px 14px;padding:7px 0;border-top:1px solid #eef0f4;font-size:14px}
.review .rv .a{font-weight:600}
.review .rv .a.empty{color:#a3aab6;font-weight:400}
.review h3{margin:16px 0 4px;color:var(--teal);font-size:15px}
/* patient mode */
.patient .q .ql{font-size:19px}
.patient .opt{font-size:17px;min-height:52px;padding:10px 16px}
.patient .row .rl{font-size:17px}
.patient .row .opts .opt{font-size:16px;min-height:46px}
.patient input{font-size:18px}
.face{font-size:24px}
.plate{width:44px;height:44px}
/* panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--mut)}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;break-inside:avoid}
.chart h4{margin:0 0 2px;color:var(--navy);font-size:15px}
.chart .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.br{display:grid;grid-template-columns:minmax(110px,40%) 1fr 64px;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}
.br .tr{background:#eef1f5;border-radius:6px;height:18px;overflow:hidden}
.br .tr i{display:block;height:100%;border-radius:6px}
.br .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
table.lst{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.lst th{background:#eef1f6;text-align:left;padding:8px;font-size:12.5px;color:var(--mut)}
table.lst td{padding:8px;border-top:1px solid #eef0f4}
.ok{color:var(--ok);font-weight:700}.no{color:#b3261e;font-weight:700}
.foot{font-size:12px;color:var(--mut);margin-top:26px;text-align:center}
.printonly{display:none}
@media (max-width:600px){
  .charts{grid-template-columns:1fr}
  .review .rv{grid-template-columns:1fr}
  header.top .brand small{display:none}
  #hl2{display:none!important}
}
@media print{
  header.top,.bar,.noprint,.pnav,.toast{display:none!important}
  .printonly{display:block}
  body{background:#fff}
  main{max-width:none;padding:0}
  .chart,.kpi,.q{box-shadow:none}
  .charts{grid-template-columns:1fr 1fr}
}
</style>

<body>
<header class="top">
  <div class="brand" onclick="go('')"><img class="hlogo" id="hl1" alt="Logo del hospital"><img class="hlogo" id="hl2" alt="Logo del servicio de nutrición"><div class="logo" id="hlogo">nD</div><div>nutritionDay 2026<small id="hname">Registro digital</small></div></div>
  <div class="sp"></div>
  <span id="qchip" class="chip warn" style="display:none" onclick="flushQueue(true)"></span>
  <span id="mchip" class="chip">…</span>
</header>
<main id="app"></main>
<div id="bar" class="bar" style="display:none"><div class="in" id="barin"></div></div>

<script>
/* =====================================================================
   1. ALMACENAMIENTO LOCAL SEGURO
   ===================================================================== */
const mem = {};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

/* =====================================================================
   2. BACKEND: Google Apps Script o MODO DEMO (datos solo en este dispositivo)
   ===================================================================== */
const APPCFG = Object.assign({API_URL:'', LOGO_HOSPITAL:'assets/logo-hospital.png', LOGO_NUTRICION:'assets/logo-nutricion.png', NOMBRE_SERVICIO:'', MANUAL_URL:'docs/Manual_Registro_nDay_HPF.pdf'}, window.NDAY_CONFIG||{});
function apiUrl(){ const o = LS.get('ndhpf_api_override', ''); return String(o || APPCFG.API_URL || '').trim(); }
const MODE = apiUrl() ? 'api' : (window.google && google.script && google.script.run) ? 'gas' : 'demo';
const DEMO = MODE === 'demo';
const Mock = {
  _db(){ return LS.get('ndhpf_demo', {hospital:[],unidad:[],pac2:[],pac3:[],seg:[],id:[]}); },
  _save(db){ LS.set('ndhpf_demo', db); },
  getConfig(){ return {hospital:'Hospital Papa Francisco (DEMO)', centro:'DEMO', fecha:'2026-11-12',
    unidades:[{nombre:'Clínica Médica',codigo:'CM-DEMO',tipo:'medica'},{nombre:'Cirugía',codigo:'CX-DEMO',tipo:'quirurgica'}]}; },
  _clave(t,r){ return t==='hospital'?'HOSPITAL': t==='unidad' ? 'U|'+r['Unidad'] : r['Unidad']+'|'+r['Paciente N°']; },
  _up(arr, clave, rec){ const i = arr.findIndex(o=>o._clave===clave); const o = Object.assign(i>=0?arr[i]:{}, rec, {_clave:clave,_actualizado:new Date().toISOString()});
    Object.keys(o).forEach(k=>{ if(Array.isArray(o[k])) o[k]=o[k].join(' | '); }); if(i>=0) arr[i]=o; else arr.push(o); return i>=0; },
  guardar(t, rec, ident){ const db=this._db(); const c=this._clave(t,rec); const u=this._up(db[t], c, rec);
    if(ident && (ident.dni||ident.cama)) this._up(db.id, c, {'Unidad':rec['Unidad'],'Paciente N°':rec['Paciente N°'],'DNI':ident.dni,'Cama / habitación':ident.cama,'Fecha nDay':rec['Fecha']});
    this._save(db); return {ok:true, actualizado:u, clave:c}; },
  obtener(t,u,p){ const c = t==='hospital'?'HOSPITAL': t==='unidad'?'U|'+u : u+'|'+p; return this._db()[t].find(o=>o._clave===c)||null; },
  siguientePaciente(u){ let m=0; this._db().pac2.forEach(o=>{ if(o['Unidad']===u){ const n=parseInt(String(o['Paciente N°']).replace(/\D/g,''),10); if(n>m) m=n; }}); return m+1; },
  _pin(p){ if(String(p)!=='1234') throw new Error('PIN incorrecto (en la demostración el PIN es 1234)'); },
  datosPanel(p){ this._pin(p); const db=this._db(); return {config:this.getConfig(), hospital:db.hospital, unidad:db.unidad, pac2:db.pac2, pac3:db.pac3, seg:db.seg}; },
  listaSeguimiento(p){ this._pin(p); const db=this._db(); const ids={}, segs={}; db.id.forEach(o=>ids[o._clave]=o); db.seg.forEach(o=>segs[o._clave]=o);
    return db.pac2.map(o=>{ const i=ids[o._clave]||{}; return {unidad:o['Unidad'],paciente:o['Paciente N°'],consentimiento:o['Consentimiento informado']||'',dni:i['DNI']||'',cama:i['Cama / habitación']||'',fecha:o['Fecha']||'',cargado:!!segs[o._clave]}; }); }
};
async function apiFetch(url, fn, args){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args}), redirect:'follow'});
  if (!r.ok) throw new Error('Sin conexión con la planilla (HTTP '+r.status+')');
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error de la planilla');
  return j.data;
}
function api(fn, ...args){
  if (MODE === 'api') return apiFetch(apiUrl(), fn, args);
  if (DEMO) return new Promise((res,rej)=>setTimeout(()=>{ try{ res(Mock[fn](...args)); }catch(e){ rej(e); } }, 120));
  return new Promise((res,rej)=>{ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
}

/* =====================================================================
   3. DEFINICIÓN DE LOS FORMULARIOS (fiel a los cuestionarios nutritionDay en el Hospital 2024 v1)
   ===================================================================== */
const SNS = ['Sí','No','No lo sé'], SN = ['Sí','No'];
const ICD = [['0600','El sistema nervioso'],['0500','Trastornos mentales y del comportamiento'],['0700','El ojo y sus anexos'],['0800','El oído y la apófisis mastoides'],
 ['0900','El sistema circulatorio'],['1000','El sistema respiratorio'],['0400','Enfermedades endocrinas, nutricionales y metabólicas'],['1100','El sistema digestivo'],
 ['1400','El sistema genitourinario'],['1300','El sistema osteomuscular y el tejido conjuntivo'],['1200','La piel y el tejido subcutáneo'],['0100','Enfermedades infecciosas y parasitarias'],
 ['0200','Tumores [neoplasias]'],['0300','Sangre, órganos hematopoyéticos, mecanismos inmunológicos'],['1800','Síntomas, hallazgos anormales clínicos/de laboratorio'],
 ['2000','Causas externas de morbilidad y de mortalidad'],['1500','Embarazo, parto y puerperio'],['1600','Afecciones originadas en el período perinatal'],
 ['1700','Malformaciones congénitas, deformidades y anomalías cromosómicas'],['1900','Lesiones, envenenamientos'],['2100','Factores que influyen en el estado de salud y contacto con los servicios de salud']]
 .map(([c,l])=>c+' · '+l).concat(['Ninguna de las anteriores']);
const KCAL = ['< 500 kcal','500 - 999 kcal','1000 - 1499 kcal','1500 - 1999 kcal','>= 2000 kcal','No determinado','No lo sé'];
function plate(f){ // f: fracción consumida
  const r=18, cx=22, cy=22; let path='';
  if (f>=1) path=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#0F7C7C"/>`;
  else if (f>0){ const a=2*Math.PI*f, x=cx+r*Math.sin(a), y=cy-r*Math.cos(a); path=`<path d="M${cx},${cy} L${cx},${cy-r} A${r},${r} 0 ${f>.5?1:0},1 ${x},${y} Z" fill="#0F7C7C"/>`; }
  return `<svg class="plate" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fff" stroke="#9aa3b2" stroke-width="2"/>${path}</svg>`;
}
const isSurg = ctx => ctx.unidad && ctx.unidad.tipo === 'quirurgica';
const consOK = D => D['Consentimiento informado'] === 'Sí';

// Encabezados comunes
const H_UNIDAD = {id:'unidad', t:'unidad', k:'Unidad', l:'Unidad', req:true};
const H_PAC = {id:'pac', t:'paciente', k:'Paciente N°', l:'Paciente número', req:true, h:'Número correlativo dentro de la unidad (1, 2, 3…). El mismo número se usa en las hojas 2 y 3 y en el seguimiento a 30 días.'};
const H_FECHA = {id:'fecha', t:'date', k:'Fecha', l:'Fecha', def:'nday'};

const FORMS = {
 hospital: {
  title:'Hoja del Hospital', short:'Hospital', tag:'1 por hospital', cls:'t-navy', ic:'🏥', sheet:'hospital',
  who:'Coordinación (Lic. a cargo)', time:'≈ 10 min',
  intro:'Se completa UNA sola vez para todo el hospital. Datos de estructura: camas, ingresos del año pasado, personal y protocolos.',
  pages:[
   {t:'Datos generales', qs:[ H_FECHA,
     {id:'centro', t:'text', k:'Código del Centro', l:'Código del Centro', def:'centro'},
     {id:'H1', t:'num', k:'H1 Camas totales del hospital', l:'Número total de camas en el hospital'},
     {id:'H2', t:'num', k:'H2 Ingresos año pasado', l:'Número total de ingresos en el hospital el año pasado'} ]},
   {t:'Personal', qs:[
     {id:'H3', t:'numgrid', k:'H3 Personal', l:'Número total de personal en el hospital',
      rows:['Total de médicos','Médicos especialistas','Médicos no especialistas','Enfermeras','Dietistas','Nutricionistas','Farmacéuticos','Personal de cocina'],
      cols:['Número total','Equivalentes a tiempo completo']} ]},
   {t:'Protocolos', qs:[
     {id:'H4', t:'radio', k:'H4 Protocolo de atención nutricional', l:'¿Tiene el hospital un protocolo de atención nutricional?', o:SNS},
     {id:'H5', t:'check', k:'H5 Guías/actividades nutricionales', l:'¿Qué guías nutricionales o actividades rutinarias relacionadas con la nutrición existen en su hospital?',
      o:['Se encuentra disponible formación en nutrición','Se encuentra disponible un comité de nutrición','Se registran y reportan los indicadores de calidad a nivel nacional/regional',
         'Se utilizan los indicadores de calidad para la evaluación comparativa interna en el hospital','Se aplican cuestionarios o encuestas para evaluar el servicio de alimentación y la comida ofrecida en el hospital']} ]},
   {t:'Codificación', qs:[
     {id:'H6x', t:'check', k:'H6 Sin información de facturación', l:'¿Cuáles son los diagnósticos disponibles y que se utilizan de rutina en su hospital para fines de facturación y reembolso?', o:['No hay información disponible sobre facturación/finanzas/control']},
     {id:'H6', t:'grid', k:'H6', l:'Para cada ítem, marque una opción', show:D=>!(D['H6 Sin información de facturación']||[]).length,
      rows:['Soporte nutricional','Suplementos nutricionales orales','Nutrición parenteral','Nutrición enteral','Recomendaciones nutricionales','Intervenciones dietéticas específicas',

let CFG = null, PIN = null, ROUTE = '', CUR = null;   // CUR = {fid, page, D, ident}
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const optObj = x => Array.isArray(x) ? {v:x[0], d:x[1]} : {v:x, d:esc(x)};
function modal(msg, withInput){
  return new Promise(res=>{
    const w=document.createElement('div');
    w.style.cssText='position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:60;display:grid;place-items:center;padding:16px';
    w.innerHTML=`<div class="card" style="max-width:420px;width:100%"><p style="margin:0 0 12px;font-weight:600;color:var(--navy)">${esc(msg)}</p>
      ${withInput?'<input type="password" id="mdin" autocomplete="off" style="margin-bottom:12px">':''}
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="mdno">Cancelar</button><button class="btn pri" id="mdok">Aceptar</button></div></div>`;
    document.body.appendChild(w);
    const inp=w.querySelector('#mdin'); if(inp){ inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter') w.querySelector('#mdok').click(); }; }
    w.querySelector('#mdok').onclick=()=>{ const v=inp?inp.value:true; w.remove(); res(v); };
    w.querySelector('#mdno').onclick=()=>{ w.remove(); res(withInput?null:false); };
  });
}
function doPrint(){ try{ window.print(); }catch(e){} if(DEMO) setTimeout(()=>toast('Si no se abrió el diálogo de impresión: en la app instalada el botón genera el PDF.'),300); }
function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?5200:2800); }
function unitByName(n){ return (CFG && CFG.unidades || []).find(u=>u.nombre===n) || null; }
function ctxOf(D){ return {unidad: unitByName(D['Unidad'])}; }
function colKeys(q){
  if (q.t==='grid'||q.t==='gridcheck') return q.rows.map(r=>q.k+' · '+r);
  if (q.t==='numgrid') { const ks=[]; q.rows.forEach(r=>q.cols.forEach(c=>ks.push(q.k+' · '+r+' · '+c))); return ks; }
  if (q.t==='nums') return q.rows.map(r=>q.k+' · '+r[0]);
  if (q.k) return [q.k];
  return [];
}
function isAnswered(q, D){ return colKeys(q).some(k=>{ const v=D[k]; return Array.isArray(v) ? v.length>0 : (v!==undefined && v!==null && v!==''); }); }
function visiblePages(f, D){ const c=ctxOf(D); return f.pages.filter(p=>!p.show || p.show(D,c)); }
function visibleQs(p, D){ const c=ctxOf(D); return p.qs.filter(q=>!q.show || q.show(D,c)); }
function draftKey(fid){ return 'ndhpf_draft_'+fid; }
function saveDraft(){ if(CUR) LS.set(draftKey(CUR.fid), {D:CUR.D, page:CUR.page, ident:CUR.ident}); }

/* ---- cola de envíos sin conexión ---- */
function queue(){ return LS.get('ndhpf_queue', []); }
function setQueue(q){ LS.set('ndhpf_queue', q); paintQueue(); }
function paintQueue(){ const n=queue().length, c=$('#qchip'); c.style.display=n?'':'none'; c.textContent = n+' pendiente'+(n>1?'s':'')+' de envío ⟳'; }
let flushing=false;
async function flushQueue(manual){
  if (flushing) return; const q=queue(); if(!q.length){ if(manual) toast('No hay envíos pendientes'); return; }
  flushing=true; const rest=[];
  for (const it of q){ try{ await api('guardar', it.tipo, it.rec, it.ident||null); }catch(e){ rest.push(it); } }
  flushing=false; setQueue(rest);
  if (manual || rest.length<q.length) toast(rest.length ? `Se enviaron ${q.length-rest.length}; quedan ${rest.length}` : 'Todos los registros pendientes fueron enviados ✓', !!rest.length);
}
window.addEventListener('online', ()=>flushQueue());
setInterval(()=>flushQueue(), 45000);

function go(r){ location.hash = r; }
window.addEventListener('hashchange', route);
function route(){
  ROUTE = location.hash.replace(/^#/, '');
  const [a, b] = ROUTE.split('/');
  $('#bar').style.display='none'; window.scrollTo(0,0);
  if (!a) return viewHome();
  if (FORMS[a]) return openForm(a, b==='nuevo');
  if (a==='panel') return viewPanel();
  if (a==='seguimiento') return viewSeguimiento();
  if (a==='ayuda') return viewAyuda();
  if (a==='ajustes') return viewAjustes();
  viewHome();
}

function openForm(fid, fresh, preset){
  const f=FORMS[fid];
  let st = fresh ? null : LS.get(draftKey(fid), null);
  CUR = {fid, page:0, D:{}, ident:{}};
  if (st && st.D){ CUR.D=st.D; CUR.page=st.page||0; CUR.ident=st.ident||{}; }
  if (preset) Object.assign(CUR.D, preset);
  applyDefaults(f);
  renderForm();
}
function applyDefaults(f){
  f.pages.forEach(p=>p.qs.forEach(q=>{
    if (q.def && (CUR.D[q.k]===undefined || CUR.D[q.k]==='')){
      if (q.def==='nday') CUR.D[q.k]=CFG.fecha||'';
      if (q.def==='centro') CUR.D[q.k]=CFG.centro||'';
    }
  }));
  if (f.sheet!=='hospital' && !CUR.D['Unidad'] && CFG.unidades.length===1) CUR.D['Unidad']=CFG.unidades[0].nombre;
  if (CFG.centro && !CUR.D['Código del Centro'] && f.sheet!=='hospital') CUR.D['Código del Centro']=CFG.centro;
  syncUnitCode();
}
function syncUnitCode(){ const u=unitByName(CUR.D['Unidad']); if(u && u.codigo && !CUR.D['Código de la Unidad']) CUR.D['Código de la Unidad']=u.codigo; }

function renderForm(){
  const f=FORMS[CUR.fid], D=CUR.D, pages=visiblePages(f, D);
  if (CUR.page>pages.length) CUR.page=pages.length;
  const onReview = CUR.page===pages.length;
  const p = pages[CUR.page];
  const pct = Math.round(100*CUR.page/pages.length);
  const isPatientPage = f.patient && p && !p.staff;
  $('#app').className = isPatientPage ? 'patient' : '';
  $('#app').innerHTML = `
   <div class="fhead"><span class="badge ${f.cls}">${f.ic} ${esc(f.tag)}</span><span class="unit">${esc(f.who)} · ${f.time}</span></div>
   <h1>${esc(f.title)}</h1>
   ${CUR.page===0?`<p class="lead">${esc(f.intro)}</p>`:''}
   ${(D['Unidad']||D['Paciente N°'])&&CUR.page>0?`<div class="unit"><b>${esc(D['Unidad']||'')}</b>${D['Paciente N°']?' · Paciente N° <b>'+esc(D['Paciente N°'])+'</b>':''}</div>`:''}
   <div class="prog"><i style="width:${onReview?100:pct}%"></i></div>
   <div class="pnav noprint">${pages.map((pg,i)=>`<button class="${i===CUR.page?'on':''} ${i<CUR.page?'done':''}" onclick="jump(${i})">${i+1}. ${esc(pg.t)}</button>`).join('')}
     <button class="${onReview?'on':''}" onclick="jump(${pages.length})">✓ Revisar y guardar</button></div>
   <div id="qs">${onReview ? reviewHTML(f, D) : visibleQs(p, D).map(q=>qHTML(q, D)).join('')}</div>`;
  bindInputs();
  const bar=$('#bar'), bi=$('#barin'); bar.style.display='';
  if (onReview){
    bi.innerHTML = `<button class="btn ghost" onclick="jump(CUR.page-1)">← Atrás</button><span class="grow"></span>
      <button class="btn pri" id="savebtn" onclick="submitForm()">Guardar ${isPatientPage||f.patient?'respuestas':'registro'}</button>`;
  } else {
    bi.innerHTML = `${CUR.page>0?'<button class="btn ghost" onclick="jump(CUR.page-1)">← Atrás</button>':`<button class="btn ghost" onclick="go(\'\')">Inicio</button>`}
      <span class="grow"></span>
      ${CUR.page===0 && !f.patient && f.sheet!=='hospital' ? '<button class="btn sm ghost" onclick="loadExisting()">Cargar datos guardados</button>':''}
      ${CUR.page===0 && f.sheet==='hospital' ? '<button class="btn sm ghost" onclick="loadExisting()">Cargar datos guardados</button>':''}
      <button class="btn navy" onclick="next()">${f.patient&&CUR.page===0?'Entregar al paciente →':'Siguiente →'}</button>`;
  }
}
async function jump(i){ if(i>CUR.page && !(await validatePage())) return; CUR.page=Math.max(0,i); saveDraft(); renderForm(); window.scrollTo(0,0); }
function next(){ jump(CUR.page+1); }
async function validatePage(){
  const f=FORMS[CUR.fid], pages=visiblePages(f, CUR.D), p=pages[CUR.page]; if(!p) return true;
  for (const q of visibleQs(p, CUR.D)){
    if (q.req && !isAnswered(q, CUR.D)){ toast('Falta completar: '+q.l, true); return false; }
    if (q.t==='num' && q.k && CUR.D[q.k]!=='' && CUR.D[q.k]!=null && CUR.D[q.k]!=='No lo sé'){
      const v=Number(CUR.D[q.k]);
      if ((q.min!=null && v<q.min) || (q.max!=null && v>q.max)){
        if(!(await modal(`El valor ${v} en “${q.l}” parece fuera de rango (${q.min}–${q.max}). ¿Continuar igual?`))) return false;
      }
    }
  }
  return true;
}

function qHTML(q, D){
  const ans = isAnswered(q, D) ? ' answered' : '';
  const code = q.k && /^(\d|U\d|H\d|30d)/.test(q.k) ? '' : '';
  const head = `<div class="ql">${esc(q.l||'')}${q.req?' <span style="color:var(--bord)">*</span>':''}</div>${q.h?`<div class="qh">${esc(q.h)}</div>`:''}`;
  switch(q.t){
   case 'info': return `<div class="hint teal">${esc(q.l)}</div>`;
   case 'imc': return `<div id="imcbox">${imcHTML(D)}</div>`;
   case 'unidad': return `<div class="q${ans}">${head}<div class="opts">${CFG.unidades.map(u=>`<button type="button" class="opt ${D[q.k]===u.nombre?'sel':''}" data-k="${esc(q.k)}" data-v="${esc(u.nombre)}" data-m="radio">${esc(u.nombre)}${u.tipo==='quirurgica'?' <small>(quirúrgica)</small>':''}</button>`).join('')}</div>
      ${!CFG.unidades.length?'<div class="hint bord">No hay unidades configuradas. Completar la hoja Config.</div>':''}</div>`;
   case 'paciente': return `<div class="q${ans}">${head}<div class="inl"><input type="text" inputmode="numeric" data-k="${esc(q.k)}" value="${esc(D[q.k]??'')}" placeholder="Ej.: 1">
      <button type="button" class="btn sm ghost" onclick="suggestNum()">Sugerir siguiente</button></div></div>`;
   case 'ident': return `<div class="q idbox">${head}
      <div class="qh">Estos datos NO forman parte de nutritionDay. Se guardan en una hoja separada y protegida, solo para buscar la historia clínica y hacer el seguimiento a 30 días.</div>
      <div class="inl" style="flex-wrap:wrap"><div style="flex:1;min-width:160px"><div class="unit">DNI</div><input type="text" inputmode="numeric" data-ident="dni" value="${esc(CUR.ident.dni||'')}" placeholder="Sin puntos"></div>
      <div style="flex:1;min-width:140px"><div class="unit">Cama / habitación</div><input type="text" data-ident="cama" value="${esc(CUR.ident.cama||'')}"></div></div></div>`;
   case 'text': return `<div class="q${ans}">${head}<input type="text" data-k="${esc(q.k)}" value="${esc(D[q.k]??'')}" ${q.list?`list="${q.list}"`:''}>
      ${q.list?`<datalist id="${q.list}">${ICD.slice(0,-1).map(x=>`<option value="${esc(x.slice(0,4))}">${esc(x)}</option>`).join('')}</datalist>`:''}</div>`;
   case 'date': return `<div class="q${ans}">${head}<input type="date" data-k="${esc(q.k)}" value="${esc(D[q.k]??'')}"></div>`;

function fmtVal(v){ if(Array.isArray(v)) return v.length? v.map(esc).join('<br>') : ''; return esc(v??''); }
function reviewHTML(f, D){
  const pages=visiblePages(f, D); let total=0, done=0;
  const secs = pages.map(p=>{
    const rows=[];
    visibleQs(p, D).forEach(q=>{
      if (['info','imc','ident'].includes(q.t)) return;
      if (['grid','gridcheck','nums','numgrid'].includes(q.t)){
        const ks=colKeys(q); const labels = q.t==='numgrid' ? q.rows.flatMap(r=>q.cols.map(c=>r+' · '+c)) : q.t==='nums'? q.rows.map(r=>r[0]) : q.rows;
        ks.forEach((k,i)=>{ total++; const v=fmtVal(D[k]); if(v) done++; rows.push(`<div class="rv"><div>${esc(q.l.split('—')[0].slice(0,60))} · ${esc(labels[i])}</div><div class="a ${v?'':'empty'}">${v||'—'}</div></div>`); });
      } else { total++; const v=fmtVal(D[q.k]); if(v) done++; rows.push(`<div class="rv"><div>${esc(q.l)}</div><div class="a ${v?'':'empty'}">${v||'—'}</div></div>`); }
    });
    return `<h3>${esc(p.t)}</h3>${rows.join('')}`;
  }).join('');
  const noCons = f.sheet==='pac2' && D['Consentimiento informado']==='No';
  return `<div class="card review">

     ${f.patient?'<div class="hint teal" style="font-size:17px"><b>¡Gracias por participar!</b> Si está de acuerdo con sus respuestas, toque “Guardar respuestas” y devuelva el dispositivo al equipo.</div>':''}
     <div class="unit">Completadas <b>${done}</b> de ${total} respuestas. Las vacías se pueden dejar en blanco si no corresponden.</div>

async function submitForm(){
  const f=FORMS[CUR.fid], D=CUR.D, pages=visiblePages(f, D);
  for (const p of pages) for (const q of visibleQs(p, D)) if (q.req && !isAnswered(q, D)) return toast('Falta completar: '+q.l, true);
  const rec={};
  const keep = new Set(['Unidad','Paciente N°','Fecha','Código del Centro','Código de la Unidad']);
  // Solo columnas de preguntas visibles (lo oculto se guarda vacío para limpiar respuestas que ya no aplican)
  f.pages.forEach(p=>p.qs.forEach(q=>{ const vis = (!p.show||p.show(D,ctxOf(D))) && (!q.show||q.show(D,ctxOf(D)));
    colKeys(q).forEach(k=>{ rec[k] = vis ? (D[k]??'') : ''; }); }));
  keep.forEach(k=>{ if(D[k]!==undefined) rec[k]=D[k]; });
  if (f.sheet==='hospital') delete rec['Unidad'];
  const ident = f.ident && D['Consentimiento informado']==='Sí' ? {dni:(CUR.ident.dni||'').replace(/\D/g,''), cama:CUR.ident.cama||''} : null;
  const btn=$('#savebtn'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    const r = await api('guardar', f.sheet, rec, ident);
    afterSave(f, D, r.actualizado ? 'Registro actualizado ✓' : 'Registro guardado ✓', false);
  }catch(e){
    const msg=String(e && e.message || e);
    if (/Falta|No permitido|desconocido/.test(msg)){ toast(msg, true); if(btn){btn.disabled=false; btn.textContent='Guardar';} return; }
    const q=queue(); q.push({tipo:f.sheet, rec, ident, t:Date.now()}); setQueue(q);
    afterSave(f, D, 'Sin conexión: quedó guardado en este dispositivo y se enviará solo.', true);
  }
}

function countMulti(rows, key){ const m=new Map(); rows.forEach(r=>multi(r[key]).forEach(v=>m.set(v,(m.get(v)||0)+1))); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }

    ${avance.map(a=>`<tr><td>${esc(a.u)}</td><td>${a.hoja1?'<span class="ok">✓</span>':'<span class="no">falta</span>'}</td><td>${esc(a.censo)}</td><td>${a.reg}</td><td>${a.cons}</td><td>${a.p3} ${a.p3<a.cons?'<span class="no">('+(a.cons-a.p3)+' faltan)</span>':''}</td><td>${a.seg}</td></tr>`).join('')}
   </table></div>
   ${pend.length?`<div class="hint noprint">Pacientes con hoja 2 pero sin cuestionario 3a/3b: ${pend.map(esc).join(', ')}</div>`:''}
   <div class="noprint" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
     <button class="btn navy" onclick="go('seguimiento')">📅 Lista de seguimiento a 30 días</button>
     <button class="btn ghost" onclick="viewFichas()">📄 Fichas por paciente (para transcribir)</button></div>
   <div class="foot">Datos preliminares de uso interno · Basado en nutritionDay en el Hospital (CC BY-NC-ND).</div>`;
  $('#pf').onchange = e=>{ PF=e.target.value; renderPanel(); };
}
function viewFichas(){
  const rows = PD.pac2.slice().sort((a,b)=>(a['Unidad']+a['Paciente N°']).localeCompare(b['Unidad']+b['Paciente N°'], 'es', {numeric:true}));
  $('#app').innerHTML = `<div class="noprint" style="display:flex;gap:10px;align-items:center"><h1 style="flex:1">Fichas por paciente</h1><button class="btn sm ghost" onclick="renderPanel()">← Panel</button></div>
   <p class="lead noprint">Vista ordenada como los cuestionarios, útil para transcribir a la base nutritionDay. “Editar” abre el formulario con los datos cargados.</p>
   <div style="overflow-x:auto"><table class="lst"><tr><th>Unidad</th><th>N°</th><th>Consent.</th><th>2a/2b/2c</th><th>3a/3b</th><th></th></tr>
   ${rows.map(r=>{ const has3=PD.pac3.some(x=>x._clave===r._clave); return `<tr><td>${esc(r['Unidad'])}</td><td>${esc(r['Paciente N°'])}</td><td>${esc(r['Consentimiento informado'])}</td>
     <td><button class="btn sm ghost" onclick="ficha('pac2','${esc(r._clave)}')">Ver</button> <button class="btn sm ghost" onclick="editRec('pac2','${esc(r._clave)}')">Editar</button></td>
     <td>${has3?`<button class="btn sm ghost" onclick="ficha('pac3','${esc(r._clave)}')">Ver</button> <button class="btn sm ghost" onclick="editRec('pac3','${esc(r._clave)}')">Editar</button>`:'<span class="no">falta</span>'}</td><td></td></tr>`; }).join('')}
   </table></div>`;
}
function recToD(fid, r){
  const f=FORMS[fid], D={};
  f.pages.flatMap(p=>p.qs).forEach(q=>colKeys(q).forEach(k=>{ if(r[k]===undefined||r[k]==='') return; D[k] = (q.t==='check'||q.t==='gridcheck') ? multi(r[k]) : String(r[k]); }));
  ['Unidad','Paciente N°','Fecha','Código del Centro','Código de la Unidad'].forEach(k=>{ if(r[k]!==undefined) D[k]=String(r[k]); });
  return D;
}
function ficha(fid, clave){
  const r = PD[fid].find(x=>x._clave===clave); if(!r) return;
  const D=recToD(fid, r);
  $('#app').innerHTML = `<div class="noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="flex:1">${esc(FORMS[fid].title)}</h1>
     <button class="btn sm navy" onclick="doPrint()">🖨 Imprimir</button><button class="btn sm ghost" onclick="viewFichas()">← Fichas</button></div>
   <div class="unit"><b>${esc(D['Unidad'])}</b> · Paciente N° <b>${esc(D['Paciente N°'])}</b> · Código de centro ${esc(PD.config.centro)} · ${fmtDate(D['Fecha'])}</div>
   ${reviewHTML(FORMS[fid], D)}`;
}
function editRec(fid, clave){
  const r = PD[fid].find(x=>x._clave===clave); if(!r) return;
  LS.del(draftKey(fid)); history.replaceState(null,'','#'+fid); openForm(fid, true, recToD(fid, r)); CUR.page=0; renderForm();
}
async function viewSeguimiento(){
  $('#app').className='';
  if(!(await askPin())) return go('');
  $('#app').innerHTML='<p class="lead">Cargando…</p>';
  let L; try{ L = await api('listaSeguimiento', PIN); }catch(e){ PIN=null; toast(String(e.message||e), true); return go(''); }
  L = L.filter(x=>x.consentimiento==='Sí').sort((a,b)=>(a.unidad+a.paciente).localeCompare(b.unidad+b.paciente,'es',{numeric:true}));
  const d30 = (()=>{ const d=new Date((CFG.fecha||'2026-11-12')+'T12:00:00'); d.setDate(d.getDate()+30); return d.toLocaleDateString('es-AR'); })();
  $('#app').innerHTML = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="flex:1">Seguimiento a 30 días</h1><button class="btn sm navy noprint" onclick="doPrint()">🖨 Imprimir</button></div>
   <p class="lead">Fecha de control: <b>${d30}</b>. Lista de uso local con DNI para buscar la historia clínica. <b>No compartir ni enviar a nutritionDay.</b></p>
   <div style="overflow-x:auto"><table class="lst"><tr><th>Unidad</th><th>N°</th><th>DNI</th><th>Cama</th><th>Estado</th><th class="noprint"></th></tr>
   ${L.map(x=>`<tr><td>${esc(x.unidad)}</td><td>${esc(x.paciente)}</td><td>${esc(x.dni)||'<span class="no">sin DNI</span>'}</td><td>${esc(x.cama)}</td>
     <td>${x.cargado?'<span class="ok">✓ cargado</span>':'pendiente'}</td>
     <td class="noprint"><button class="btn sm ${x.cargado?'ghost':'pri'}" onclick="openSeg('${esc(x.unidad)}','${esc(x.paciente)}',${x.cargado})">${x.cargado?'Editar':'Cargar'}</button></td></tr>`).join('') || '<tr><td colspan="6" class="unit">Todavía no hay pacientes con consentimiento.</td></tr>'}
   </table></div>`;
}
async function openSeg(u, p, cargado){
  LS.del(draftKey('seg')); history.replaceState(null,'','#seg');
  openForm('seg', true, {'Unidad':u, 'Paciente N°':p});
  if (cargado) await loadExisting();
}

/* ---- datos ficticios para la demostración ---- */
function demoData(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)], db=Mock._db();
  const units=[['Clínica Médica','medica',22],['Cirugía','quirurgica',18]];
  units.forEach(([u,t,n])=>{
    Mock._up(db.unidad,'U|'+u,{'Unidad':u,'Fecha':'2026-11-12','U2 Pacientes registrados a mediodía':n+4,'U3 Capacidad total de camas':n+8});
    for(let i=1;i<=n;i++){
      const c=Math.random()<.92?'Sí':'No', k=u+'|'+i;
      const r={'Unidad':u,'Paciente N°':String(i),'Fecha':'2026-11-12','Consentimiento informado':c};
      if(c==='Sí'){
        r['2a Año de nacimiento']=1935+Math.floor(Math.random()*65); r['2a Peso (kg)']=(45+Math.random()*50).toFixed(1); r['2a Estatura (cm)']=150+Math.floor(Math.random()*35);
        r['2a.8 Identificado como desnutrido/en riesgo']=rnd(['Desnutrido','En riesgo de desnutrición','En riesgo de desnutrición','No','No','No lo sé']);
        FORMS.pac2.pages.flatMap(p=>p.qs).find(q=>q.id==='Q13').rows.forEach(rw=>r['2b.13 Medidas desde la admisión · '+rw]=rnd(['Sí','No','No','No lo sé']));
        FORMS.pac2.pages.flatMap(p=>p.qs).find(q=>q.id==='Q11').rows.forEach((rw,j)=>r['2b.11 Ingesta · '+rw]= j===0? rnd(['Sí','Sí','No']) : rnd(['Sí','No','No','No']));
        Mock._up(db.id,k,{'Unidad':u,'Paciente N°':String(i),'DNI':String(10000000+Math.floor(Math.random()*40000000)),'Cama / habitación':String(100+i)});
        if(Math.random()<.85){
          const eat=rnd(['Casi todo','Casi todo','1/2','1/4','Nada']);
          const r3={'Unidad':u,'Paciente N°':String(i),'Fecha':'2026-11-12','3b.13a Ingesta comida principal HOY':eat,
            '3a.9a Pérdida de peso últimos 3 meses':rnd(['Sí, sin intención','Sí, sin intención','No, mi peso sigue siendo el mismo','No, he ganado peso','No lo sé','Sí, intencionalmente']),
            '3a.12 Ingesta semana previa':rnd(['Normal','Normal','Aproximadamente unos 3/4 de lo normal','Aproximadamente la mitad de lo normal','Aproximadamente entre un cuarto y casi nada','Más de lo normal']),
            '3b.14 Satisfacción con la comida':rnd(['Muy satisfecho','Algo satisfecho','Algo satisfecho','Neutral','No satisfecho','Muy poco satisfecho'])};
          if(eat!=='Casi todo'){ const ms=FORMS.pac3.pages.flatMap(p=>p.qs).find(q=>q.id==='P17').o; r3['3b.17 Motivos de no comer todo']=[rnd(ms),rnd(ms.slice(7,12))].filter((v,ix,a)=>a.indexOf(v)===ix); }
          Mock._up(db.pac3,k,r3);
        }
      }
      Mock._up(db.pac2,k,r);
    }
  });
  Mock._save(db); toast('Datos de ejemplo cargados'); viewPanel();
}
async function demoClear(){ if(await modal('¿Borrar todos los datos de la demostración en este dispositivo?')){ LS.del('ndhpf_demo'); toast('Datos de demo borrados'); viewPanel(); } }


/* =====================================================================
   10. LOGOS, INSTALACIÓN (PWA) Y AJUSTES
   ===================================================================== */
function loadImg(img, src, onok){ if(!img||!src) return; img.onload=()=>{ img.style.display='block'; onok&&onok(); }; img.onerror=()=>{ img.style.display='none'; }; img.src=src; }
function paintLogos(){
  const any=()=>{ const l=$('#logos'); if(l) l.style.display='flex'; };
  const l=$('#logos'); if(l) l.style.display='none';
  loadImg($('#lg1'), APPCFG.LOGO_HOSPITAL, any); loadImg($('#lg2'), APPCFG.LOGO_NUTRICION, any);
}
function paintHeaderLogos(){
  const hide=()=>{ $('#hlogo').style.display='none'; };
  loadImg($('#hl1'), APPCFG.LOGO_HOSPITAL, hide); loadImg($('#hl2'), APPCFG.LOGO_NUTRICION, hide);
}
let deferredPrompt=null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; paintInstall(); });
window.addEventListener('appinstalled', ()=>{ deferredPrompt=null; toast('Acceso directo instalado ✓'); paintInstall(); });
function paintInstall(){
  const c=$('#installcard'); if(!c) return;
  if (location.protocol==='file:'){ c.style.display='none'; return; }
  if (isStandalone()){ c.style.display=''; c.innerHTML=`<div class="ic t-teal">✅</div><h3>App instalada</h3><p>Estás usando el acceso directo de este dispositivo.</p>`; return; }
  c.style.display='';
  if (deferredPrompt){
    c.innerHTML=`<div class="ic t-gold">📲</div><h3>Instalar en este dispositivo</h3><p>Agrega un acceso directo en la pantalla de inicio. Se abre como una app, a pantalla completa.</p>
      <button class="btn pri sm" style="margin-top:10px" onclick="doInstall()">Instalar acceso directo</button>`;
  } else if (isIOS()){
    c.innerHTML=`<div class="ic t-gold">📲</div><h3>Agregar a la pantalla de inicio</h3><p>En Safari: tocá <b>Compartir</b> (cuadrado con flecha ↑) → <b>Agregar a inicio</b> → <b>Agregar</b>.</p>`;
  } else {
    c.innerHTML=`<div class="ic t-gold">📲</div><h3>Agregar a la pantalla de inicio</h3><p>En Chrome: menú <b>⋮</b> → <b>Agregar a la pantalla principal</b> o <b>Instalar app</b>. En computadora: ícono de instalar en la barra de direcciones.</p>`;
  }
}
async function doInstall(){ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; paintInstall(); }

function viewAjustes(){
  const ov = LS.get('ndhpf_api_override','');
  $('#app').className='';
  $('#app').innerHTML = `<h1>Conexión con la planilla</h1>
   <p class="lead">La página guarda los datos en una planilla de Google a través de su API (Apps Script). La URL termina en <b>/exec</b>.</p>
   <div class="card">
    <div class="unit">Modo actual: <b>${MODE==='api'?'Conectado a planilla':MODE==='gas'?'Apps Script':'Demostración (sin planilla)'}</b></div>
    <div class="unit" style="margin-top:6px">URL configurada para todos (config.js): <code style="word-break:break-all">${esc(APPCFG.API_URL||'— vacía —')}</code></div>
    ${ov?`<div class="unit" style="margin-top:6px">URL solo en este dispositivo: <code style="word-break:break-all">${esc(ov)}</code></div>`:''}
    <h2>Probar o cambiar en este dispositivo</h2>
    <input type="text" id="apiin" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(ov||APPCFG.API_URL||'')}">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
     <button class="btn navy sm" onclick="testApi()">Probar conexión</button>
     <button class="btn pri sm" onclick="saveApi()">Usar en este dispositivo</button>
     ${ov?'<button class="btn ghost sm" onclick="clearApi()">Volver a la URL de config.js</button>':''}
    </div>
    <div id="apires" style="margin-top:10px"></div>
   </div>
   <div class="hint" style="margin-top:12px">Para que <b>todos</b> los dispositivos usen la planilla nueva (por ejemplo, al pasar de la cuenta personal a la del hospital) se cambia una sola línea en <b>config.js</b> del repositorio. Esta pantalla sirve para pruebas en un solo equipo.</div>`;
}
async function testApi(){
  const u=$('#apiin').value.trim(), o=$('#apires');
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){ o.innerHTML='<div class="hint bord">La URL debe empezar con https://script.google.com/</div>'; return; }
  o.innerHTML='<div class="unit">Probando…</div>';
  try{ const c=await apiFetch(u,'getConfig',[]); o.innerHTML=`<div class="hint teal">✓ Conectado: <b>${esc(c.hospital)}</b> · ${c.unidades.length} unidad(es) · nDay ${esc(fmtDate(c.fecha))}</div>`; }
  catch(e){ o.innerHTML=`<div class="hint bord">✗ No se pudo conectar: ${esc(e.message||e)}. Verificá que la implementación tenga acceso “Cualquier usuario”.</div>`; }
}
function saveApi(){ const u=$('#apiin').value.trim(); if(!/^https:\/\/script\.google\.com\//.test(u)) return toast('URL inválida', true); LS.set('ndhpf_api_override', u); location.hash=''; location.reload(); }
function clearApi(){ LS.del('ndhpf_api_override'); location.hash=''; location.reload(); }

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* =====================================================================
   9. ARRANQUE
   ===================================================================== */
(async function init(){
  const mc=$('#mchip');
  mc.textContent = DEMO ? 'Demostración' : 'Conectado';
  mc.style.cursor='pointer'; mc.onclick=()=>go('ajustes');
  paintHeaderLogos();
  if (DEMO) mc.classList.add('demo');
  try{ CFG = await api('getConfig'); LS.set('ndhpf_cfg_'+MODE, CFG); }
  catch(e){
    CFG = LS.get('ndhpf_cfg_'+MODE, null);
    if (CFG) toast('Sin conexión: se usa la última configuración guardada. Los registros se enviarán al volver la señal.', true);
    else { CFG = {hospital:'Hospital', centro:'', fecha:'', unidades:[]}; toast('No se pudo leer la configuración: '+(e.message||e), true); }
  }
  $('#hname').textContent = CFG.hospital || 'Registro digital';
  paintQueue(); flushQueue();
  route();
})();
</script>
